<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Asistencia QR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* {box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
body {max-width: 450px; margin: 20px auto; padding: 0 15px;}
h2 {text-align: center; color: #2c3e50; margin-bottom: 20px;}
#lector {width: 100%; height: 280px; border: 2px solid #27ae60; border-radius: 10px; margin-bottom: 20px;}
.botones {display: flex; gap: 10px; margin-bottom: 20px;}
button {flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;}
.btn-excel {background: #27ae60; color: white;}
.btn-limpiar {background: #e74c3c; color: white;}
.mensaje {padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; display: none;}
.exito {background: #d4edda; color: #155724;}
.error {background: #f8d7da; color: #721c24;}
table {width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;}
th, td {border: 1px solid #ddd; padding: 10px; text-align: left;}
th {background: #f2f2f2;}
.duplicado {color: #e74c3c; font-weight: bold;}
</style>
</head>
<body>

<h2>📋 Registro de Asistencia</h2>
<div id="lector"></div>
<div id="mensaje" class="mensaje"></div>

<div class="botones">
<button class="btn-excel" onclick="descargarCSV()">📥 Descargar Excel</button>
<button class="btn-limpiar" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
</div>

<table id="tabla">
<thead>
<tr>
<th>Fecha</th>
<th>Hora</th>
<th>Nombre</th>
<th>Matrícula</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="cuerpoTabla"></tbody>
</table>

<script>
// Cargar registros guardados
let registros = JSON.parse(localStorage.getItem("asistencias")) || [];
mostrarRegistros();

// Iniciar lector QR
const lector = new Html5Qrcode("lector");
lector.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: { width: 250, height: 250 } },
procesarQR
).catch(err => mostrarMensaje("❌ No se pudo acceder a la cámara", "error"));

function procesarQR(contenido) {
try {
const datos = JSON.parse(contenido);
if (!datos.nombre || !datos.matricula) throw new Error("Datos incompletos");

// Evitar duplicados el mismo día
const hoy = new Date().toLocaleDateString("es-MX");
const duplicado = registros.some(r =>
r.fecha === hoy && r.matricula === datos.matricula
);

if (duplicado) {
mostrarMensaje("⚠️ Ya registraste asistencia hoy", "error");
return;
}

// Guardar registro
const fecha = new Date();
const nuevoRegistro = {
fecha: fecha.toLocaleDateString("es-MX"),
hora: fecha.toLocaleTimeString("es-MX"),
nombre: datos.nombre,
matricula: datos.matricula,
estado: "Presente"
};

registros.push(nuevoRegistro);
localStorage.setItem("asistencias", JSON.stringify(registros));
mostrarRegistros();
mostrarMensaje("✅ Asistencia registrada", "exito");

} catch (e) {
mostrarMensaje("❌ Código QR inválido", "error");
}
}

function mostrarRegistros() {
const cuerpo = document.getElementById("cuerpoTabla");
cuerpo.innerHTML = "";
registros.forEach(r => {
const fila = document.createElement("tr");
fila.innerHTML = `
<td>${r.fecha}</td>
<td>${r.hora}</td>
<td>${r.nombre}</td>
<td>${r.matricula}</td>
<td>${r.estado}</td>
`;
cuerpo.appendChild(fila);
});
}

function descargarCSV() {
if (registros.length === 0) {
mostrarMensaje("⚠️ No hay registros para descargar", "error");
return;
}
let csv = "Fecha,Hora,Nombre,Matrícula,Estado\n";
registros.forEach(r => {
csv += `"${r.fecha}","${r.hora}","${r.nombre}","${r.matricula}","${r.estado}"\n`;
});
const enlace = document.createElement("a");
enlace.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
enlace.download = `asistencia_${new Date().toISOString().slice(0,10)}.csv`;
enlace.click();
mostrarMensaje("📁 Archivo descargado correctamente", "exito");
}

function limpiarTodo() {
if (confirm("¿Borrar TODOS los registros? No se puede deshacer.")) {
registros = [];
localStorage.removeItem("asistencias");
mostrarRegistros();
mostrarMensaje("🗑️ Registros eliminados", "exito");
}
}

function mostrarMensaje(texto, tipo) {
const div = document.getElementById("mensaje");
div.textContent = texto;
div.className = `mensaje ${tipo}`;
div.style.display = "block";
setTimeout(() => div.style.display = "none", 3000);
}
</script>
</body>
</html>
